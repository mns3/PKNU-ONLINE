<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKNU-ONLINE 텍스쳐맵 생성기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: #eee; font-family: 'Noto Sans KR', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }
        
        /* UI Panel */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 340px;
            height: 100vh;
            background: rgba(20, 20, 25, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 10;
            border-right: 1px solid #333;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            padding-bottom: 50px; /* Space for scrolling */
        }

        /* Controls */
        .slider-group { margin-bottom: 12px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; color: #ccc; font-weight: 500; }
        input[type="range"] { width: 100%; accent-color: #ec4899; cursor: pointer; height: 4px; border-radius: 2px; }
        
        .btn {
            background-color: #333; color: white; border: 1px solid #555;
            padding: 8px 12px; cursor: pointer; border-radius: 6px; font-size: 0.8rem;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn:hover { background-color: #444; border-color: #777; }
        .btn.active { background-color: #ec4899; border-color: #ec4899; color: white; }
        .btn-secondary { background-color: #2563eb; border-color: #2563eb; }
        .btn-secondary:hover { background-color: #1d4ed8; }
        
        /* Export Buttons */
        .export-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-export { background: #222; border: 1px solid #444; font-size: 0.75rem; padding: 6px; }
        .btn-export:hover { background: #333; border-color: #666; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        .hidden-canvas { display: none; }
        
        #loading {
            display: none;
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); padding: 25px; border-radius: 12px; z-index: 100;
            text-align: center; border: 1px solid #444;
        }

        /* Modal for Masking */
        #mask-modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 50;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 80%;
            border: 2px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: #222; 
            overflow: hidden; 
        }

        #mask-ref-canvas { 
            position: relative; z-index: 1; display: block; 
            max-height: 70vh; max-width: 100%; object-fit: contain;
        } 
        #mask-draw-canvas {
            position: absolute; top: 0; left: 0; z-index: 2;
            cursor: crosshair; width: 100%; height: 100%;
        }

        .modal-toolbar {
            display: flex; gap: 10px; margin-top: 15px;
            background: #333; padding: 10px 20px; border-radius: 30px;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- UI Panel -->
    <div id="ui-container">
        <h1 class="text-xl font-bold mb-1 text-pink-500 flex items-center gap-2">
            <i class="ph ph-cube-transparent"></i> PKNU-ONLINE
        </h1>
        <p class="text-xs text-gray-500 mb-5 tracking-wider">TEXTURE MAP GENERATOR v3</p>
        
        <!-- Input & Geometry -->
        <div class="mb-5 bg-gray-800 p-3 rounded-lg border border-gray-700">
            <label class="block text-xs font-bold mb-2 text-gray-300 uppercase">1. 소스 이미지</label>
            <input type="file" id="fileInput" accept="image/*" class="block w-full text-xs text-gray-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-pink-600 file:text-white hover:file:bg-pink-700 cursor-pointer"/>
        </div>

        <div class="mb-5">
            <label class="block text-xs font-bold mb-2 text-gray-300 uppercase">2. 뷰어 지오메트리</label>
            <div class="flex gap-2">
                <button class="btn flex-1 active" onclick="setGeometry('plane')"><i class="ph ph-square"></i> 평면</button>
                <button class="btn flex-1" onclick="setGeometry('cube')"><i class="ph ph-cube"></i> 큐브</button>
                <button class="btn flex-1" onclick="setGeometry('sphere')"><i class="ph ph-globe"></i> 구</button>
            </div>
        </div>

        <hr class="border-gray-700 my-4 opacity-50">

        <!-- Sliders -->
        <div id="controls" class="space-y-2">
            
            <div class="slider-group">
                <div class="slider-label">
                    <span class="text-blue-300">Normal (요철)</span>
                    <span id="val-normal">1.0</span>
                </div>
                <input type="range" id="param-normal" min="-3.0" max="3.0" step="0.1" value="1.0">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span class="text-purple-300">Displacement (높이)</span>
                    <span id="val-displacement">0.00</span>
                </div>
                <!-- 초기값 0.0, JS에서 로드 시 강제 적용 -->
                <input type="range" id="param-displacement" min="-0.3" max="0.3" step="0.01" value="0.0">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span class="text-green-300">Roughness (거칠기)</span>
                    <span id="val-roughness">1.0</span>
                </div>
                <input type="range" id="param-roughness" min="0" max="2.0" step="0.1" value="1.0">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span class="text-gray-300">Metallic (금속성)</span>
                    <span id="val-metallic">0.0</span>
                </div>
                <input type="range" id="param-metallic" min="0" max="1.0" step="0.05" value="0.0">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span class="text-yellow-300">Occlusion (음영)</span>
                    <span id="val-ao">1.0</span>
                </div>
                <input type="range" id="param-ao" min="0" max="5.0" step="0.1" value="1.0">
            </div>

             <div class="slider-group border border-pink-900 bg-pink-900/20">
                <div class="slider-label">
                    <span class="text-pink-400 font-bold">Emissive (발광)</span>
                    <span id="val-emissive">0.0</span>
                </div>
                <input type="range" id="param-emissive" min="0" max="5.0" step="0.1" value="0.0">
                <div class="mt-2 pt-2 border-t border-pink-800/50">
                    <button class="btn w-full btn-secondary" onclick="openMaskEditor()">
                        <i class="ph ph-paint-brush-broad"></i> 발광 마스크 편집
                    </button>
                </div>
            </div>

            <!-- Export Section -->
            <div class="mt-8 pt-4 border-t border-gray-700">
                <label class="block text-xs font-bold mb-2 text-gray-300 uppercase">
                    <i class="ph ph-download-simple"></i> 맵 다운로드 (.png)
                </label>
                <div class="export-grid">
                    <button class="btn btn-export" onclick="downloadMap('base')">Base Color</button>
                    <button class="btn btn-export" onclick="downloadMap('normal')">Normal</button>
                    <button class="btn btn-export" onclick="downloadMap('roughness')">Roughness</button>
                    <button class="btn btn-export" onclick="downloadMap('displacement')">Displacement</button>
                    <button class="btn btn-export" onclick="downloadMap('ao')">Occlusion</button>
                    <button class="btn btn-export" onclick="downloadMap('emissive')">Emissive</button>
                </div>
            </div>

        </div>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>
    
    <!-- Mask Editor Modal -->
    <div id="mask-modal">
        <div class="text-white mb-2 text-lg font-bold">발광(Emissive) 마스크 에디터</div>
        <div class="text-gray-400 text-sm mb-4">빛나게 하고 싶은 부분을 칠해주세요. (흰색 = 발광)</div>
        
        <div class="modal-content" id="modal-content-area">
            <canvas id="mask-ref-canvas"></canvas>
            <canvas id="mask-draw-canvas"></canvas>
        </div>

        <div class="modal-toolbar">
            <div class="flex items-center gap-2 mr-4">
                <span class="text-xs text-gray-300">크기</span>
                <input type="range" id="brush-size" min="5" max="100" value="30" class="w-20">
            </div>
            <button class="btn active" id="btn-draw" onclick="setDrawMode('draw')"><i class="ph ph-pencil"></i></button>
            <button class="btn" id="btn-erase" onclick="setDrawMode('erase')"><i class="ph ph-eraser"></i></button>
            <button class="btn" onclick="clearMask()"><i class="ph ph-trash"></i></button>
            <div class="w-[1px] h-6 bg-gray-600 mx-2"></div>
            <button class="btn bg-green-600 hover:bg-green-700" onclick="applyMask()">적용</button>
            <button class="btn bg-red-900 hover:bg-red-800" onclick="closeMaskEditor()">닫기</button>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading">
        <div class="text-pink-400">
            <i class="ph ph-spinner ph-spin text-3xl mb-2"></i><br>처리 중...
        </div>
    </div>

    <!-- Hidden Canvas -->
    <canvas id="processCanvas" class="hidden-canvas"></canvas>
    <canvas id="exportCanvas" class="hidden-canvas"></canvas>

    <script>
        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.2));
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 5, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);
        
        const pointLight = new THREE.PointLight(0xffffff, 0.5);
        pointLight.position.set(-3, 2, 3);
        scene.add(pointLight);

        // --- MATERIAL & MESH ---
        let mesh;
        let geometryType = 'plane';
        
        const material = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.5,
            metalness: 0.1,
            displacementScale: 0, // 초기값 확실히 0
            side: THREE.DoubleSide
        });

        function createMesh() {
            if (mesh) {
                scene.remove(mesh);
                mesh.geometry.dispose();
            }

            let geom;
            if (geometryType === 'plane') {
                geom = new THREE.PlaneGeometry(2, 2, 512, 512); 
            } else if (geometryType === 'cube') {
                geom = new THREE.BoxGeometry(1.5, 1.5, 1.5, 200, 200, 200);
            } else if (geometryType === 'sphere') {
                geom = new THREE.SphereGeometry(1, 256, 256);
            }
            mesh = new THREE.Mesh(geom, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.geometry.computeTangents(); 
            scene.add(mesh);
        }

        window.setGeometry = (type) => {
            geometryType = type;
            document.querySelectorAll('#ui-container .btn').forEach(b => {
                if(b.onclick && b.onclick.toString().includes('setGeometry')) b.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            createMesh();
        };
        createMesh();

        // --- STATE & STORAGE ---
        let originalImage = null;
        let currentWidth = 1024;
        let currentHeight = 1024;
        
        // Generated Data Storage (Uint8Array)
        const textureStore = {
            base: null,
            normal: null,
            roughness: null,
            ao: null,
            displacement: null,
            emissive: null
        };

        const processCanvas = document.getElementById('processCanvas');
        const ctx = processCanvas.getContext('2d');
        const exportCanvas = document.getElementById('exportCanvas');
        const exportCtx = exportCanvas.getContext('2d');

        // --- GENERATION LOGIC ---
        document.getElementById('fileInput').addEventListener('change', handleFileSelect);

        function showLoading(show) { document.getElementById('loading').style.display = show ? 'block' : 'none'; }

        function handleFileSelect(evt) {
            const file = evt.target.files[0];
            if (!file) return;
            showLoading(true);
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => { originalImage = img; generateTextures(img); };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function generateTextures(img) {
            const maxSize = 1024;
            let width = img.width;
            let height = img.height;
            if (width > height) {
                if (width > maxSize) { height *= maxSize / width; width = maxSize; }
            } else {
                if (height > maxSize) { width *= maxSize / height; height = maxSize; }
            }
            width = Math.floor(width); height = Math.floor(height);
            currentWidth = width; currentHeight = height;
            
            processCanvas.width = width; processCanvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);

            const imageData = ctx.getImageData(0, 0, width, height);
            
            // Store Base Color Data
            textureStore.base = imageData.data; // Reference only

            // Async Generation
            setTimeout(() => {
                const normalData = createNormalMap(imageData);
                const roughnessData = createRoughnessMap(imageData);
                const aoData = createAOMap(imageData);
                const displacementData = createDisplacementMap(imageData);
                
                // Store Data
                textureStore.normal = normalData;
                textureStore.roughness = roughnessData;
                textureStore.ao = aoData;
                textureStore.displacement = displacementData;
                
                // Apply to Material
                material.map = new THREE.CanvasTexture(processCanvas);
                material.map.colorSpace = THREE.SRGBColorSpace;
                
                material.normalMap = createThreeTexture(normalData, width, height);
                material.roughnessMap = createThreeTexture(roughnessData, width, height);
                material.metalnessMap = createThreeTexture(roughnessData, width, height); 
                material.aoMap = createThreeTexture(aoData, width, height);
                material.displacementMap = createThreeTexture(displacementData, width, height);
                
                // Reset Displacement to 0 specifically
                material.displacementScale = 0;
                document.getElementById('param-displacement').value = 0;
                document.getElementById('val-displacement').textContent = "0.00";

                // Reset Emissive
                resetMaskCanvas(width, height);
                textureStore.emissive = null; // Clear storage
                material.emissiveMap = null;
                material.emissiveIntensity = 0;
                material.emissive.setHex(0xffffff);
                document.getElementById('param-emissive').value = 0;
                document.getElementById('val-emissive').textContent = "0.0";
                
                material.needsUpdate = true;
                showLoading(false);
            }, 50);
        }

        function createThreeTexture(data, w, h) {
            const texture = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
            texture.flipY = true; 
            texture.needsUpdate = true;
            return texture;
        }

        // --- ALGORITHMS ---
        function getLuma(data, i) { return data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114; }

        function createNormalMap(imageData) {
            const w = imageData.width; h = imageData.height; src = imageData.data;
            const output = new Uint8Array(w * h * 4);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const right = (y * w + (x < w-1 ? x+1 : x)) * 4;
                    const up = ((y > 0 ? y-1 : y) * w + x) * 4;
                    const dx = (getLuma(src, right) - getLuma(src, i)) * 3.0; 
                    const dy = (getLuma(src, i) - getLuma(src, up)) * 3.0; 
                    const dz = 255.0;
                    const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
                    output[i] = ((dx/len)*0.5 + 0.5)*255;
                    output[i+1] = ((dy/len)*0.5 + 0.5)*255;
                    output[i+2] = ((dz/len)*0.5 + 0.5)*255;
                    output[i+3] = 255;
                }
            }
            return output;
        }

        function createRoughnessMap(imageData) {
            const src = imageData.data; output = new Uint8Array(src.length);
            for (let i = 0; i < src.length; i += 4) {
                const val = 255 - getLuma(src, i);
                output[i] = val; output[i+1] = val; output[i+2] = val; output[i+3] = 255;
            }
            return output;
        }

        function createAOMap(imageData) {
            const src = imageData.data; output = new Uint8Array(src.length);
            for (let i = 0; i < src.length; i += 4) {
                let luma = getLuma(src, i);
                luma = (luma - 100) * 1.5 + 100;
                luma = Math.min(255, Math.max(0, luma));
                output[i] = luma; output[i+1] = luma; output[i+2] = luma; output[i+3] = 255;
            }
            return output;
        }

        function createDisplacementMap(imageData) {
            // Same as roughness but different usage. Bright = high.
            const src = imageData.data; output = new Uint8Array(src.length);
            for (let i = 0; i < src.length; i += 4) {
                const luma = getLuma(src, i);
                output[i] = luma; output[i+1] = luma; output[i+2] = luma; output[i+3] = 255;
            }
            return output;
        }

        // --- MASK EDITOR ---
        const maskModal = document.getElementById('mask-modal');
        const refCanvas = document.getElementById('mask-ref-canvas');
        const drawCanvas = document.getElementById('mask-draw-canvas');
        const refCtx = refCanvas.getContext('2d');
        const drawCtx = drawCanvas.getContext('2d');
        let isDrawing = false;
        let drawMode = 'draw';
        let lastX=0, lastY=0;

        function resetMaskCanvas(w, h) {
            refCanvas.width = w; refCanvas.height = h;
            drawCanvas.width = w; drawCanvas.height = h;
            drawCtx.clearRect(0, 0, w, h);
            if(originalImage) refCtx.drawImage(processCanvas, 0, 0);
        }

        function openMaskEditor() {
            if(!originalImage) { alert("이미지를 먼저 업로드해주세요."); return; }
            maskModal.style.display = 'flex';
            refCtx.drawImage(processCanvas, 0, 0);
        }
        function closeMaskEditor() { maskModal.style.display = 'none'; }
        function setDrawMode(mode) {
            drawMode = mode;
            document.getElementById('btn-draw').classList.toggle('active', mode==='draw');
            document.getElementById('btn-erase').classList.toggle('active', mode==='erase');
        }
        function clearMask() { drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height); }

        function getPos(e) {
            const rect = drawCanvas.getBoundingClientRect();
            const scaleX = drawCanvas.width / rect.width;
            const scaleY = drawCanvas.height / rect.height;
            return { x: (e.clientX - rect.left)*scaleX, y: (e.clientY - rect.top)*scaleY };
        }
        drawCanvas.addEventListener('mousedown', (e) => { isDrawing=true; const p=getPos(e); lastX=p.x; lastY=p.y; draw(e); });
        drawCanvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', () => isDrawing=false);
        function draw(e) {
            if (!isDrawing) return;
            const p = getPos(e);
            drawCtx.lineWidth = document.getElementById('brush-size').value;
            drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round';
            if (drawMode === 'draw') {
                drawCtx.globalCompositeOperation = 'source-over';
                drawCtx.strokeStyle = 'rgba(255,255,255,1)';
            } else {
                drawCtx.globalCompositeOperation = 'destination-out';
            }
            drawCtx.beginPath(); drawCtx.moveTo(lastX, lastY); drawCtx.lineTo(p.x, p.y); drawCtx.stroke();
            lastX=p.x; lastY=p.y;
        }

        function applyMask() {
            showLoading(true);
            setTimeout(() => {
                createEmissiveTextureFromMask();
                closeMaskEditor();
                if(parseFloat(document.getElementById('param-emissive').value) === 0) {
                    document.getElementById('param-emissive').value = 1.0;
                    document.getElementById('val-emissive').textContent = "1.0";
                    material.emissiveIntensity = 1.0;
                    material.emissive.setHex(0xffffff);
                }
                showLoading(false);
            }, 100);
        }

        function createEmissiveTextureFromMask() {
            const w = currentWidth; h = currentHeight;
            const colorData = ctx.getImageData(0, 0, w, h).data;
            const maskData = drawCtx.getImageData(0, 0, w, h).data;
            const emissiveData = new Uint8Array(w * h * 4);
            
            for (let i = 0; i < colorData.length; i += 4) {
                if (maskData[i + 3] > 10) {
                    emissiveData[i] = colorData[i]; emissiveData[i+1] = colorData[i+1]; emissiveData[i+2] = colorData[i+2]; emissiveData[i+3] = 255;
                } else {
                    emissiveData[i] = 0; emissiveData[i+1] = 0; emissiveData[i+2] = 0; emissiveData[i+3] = 255;
                }
            }
            textureStore.emissive = emissiveData; // Store for export
            material.emissiveMap = createThreeTexture(emissiveData, w, h);
            material.needsUpdate = true;
        }

        // --- EXPORT LOGIC ---
        window.downloadMap = (type) => {
            if (!textureStore[type] && type !== 'base') {
                alert("아직 맵이 생성되지 않았습니다."); return;
            }
            
            exportCanvas.width = currentWidth;
            exportCanvas.height = currentHeight;
            
            let data;
            if (type === 'base') {
                // Base is just the current image on processCanvas
                exportCtx.drawImage(processCanvas, 0, 0);
            } else {
                data = textureStore[type];
                if (!data) { alert("해당 맵 데이터가 없습니다."); return; }
                const imgData = new ImageData(new Uint8ClampedArray(data), currentWidth, currentHeight);
                exportCtx.putImageData(imgData, 0, 0);
            }

            const link = document.createElement('a');
            link.download = `pknu_texture_${type}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        };

        // --- SLIDERS ---
        function bindSlider(id, targetProp, isColor = false, isScale = false, isDisp = false) {
            const slider = document.getElementById(id);
            const display = slider.parentElement.querySelector('span:last-child');
            slider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                display.textContent = val.toFixed(isDisp ? 2 : 1);
                if (isScale) material[targetProp].set(val, val);
                else if (isDisp) material[targetProp] = val;
                else if (isColor) { material[targetProp] = val; material.emissive.setHex(0xffffff); }
                else material[targetProp] = val;
            });
        }
        bindSlider('param-normal', 'normalScale', false, true);
        bindSlider('param-displacement', 'displacementScale', false, false, true);
        bindSlider('param-roughness', 'roughness');
        bindSlider('param-metallic', 'metalness');
        bindSlider('param-ao', 'aoMapIntensity');
        bindSlider('param-emissive', 'emissiveIntensity', true);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        animate();
    </script>
</body>
</html>
